<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>할 일</h1>
      <p class="date" id="today"></p>
    </header>

    <form id="new-form" class="new" autocomplete="off">
      <input id="new-input" type="text" placeholder="할 일을 입력하세요" maxlength="200" aria-label="새 할 일">
      <button type="submit">추가</button>
    </form>

    <nav class="filters" aria-label="필터">
      <button type="button" data-filter="all" class="active">전체</button>
      <button type="button" data-filter="active">진행 중</button>
      <button type="button" data-filter="done">완료</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>할 일이 없습니다.</p>

    <footer class="footer">
      <span id="count"></span>
      <button type="button" id="clear-done" class="link">완료 항목 삭제</button>
    </footer>

    <p class="hint">더블클릭하여 수정 · Enter 저장 · Esc 취소</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
